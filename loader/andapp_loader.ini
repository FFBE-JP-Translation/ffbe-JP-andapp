# andapp_loader.ini - configuration for the winmm.dll preservation loader.
# Place next to FF_EXVIUS.exe together with the compiled winmm.dll.

[loader]
log      = true
# logpath =           ; default: <dll dir>\andapp_loader.log

[helper]
# Built-in AndAppHelper replacement (so the official AndApp client isn't needed).
enabled           = true
command_port      = 51100
notification_port = 51101
write_cfg         = true
# Keep AndAppHelper.cfg in the game folder and transparently redirect the game's
# read there (via a CreateFileW hook), so the real AndApp's
# %APPDATA%\AndApp\AndAppHelper.cfg is never written or read. Set false to use
# the real %APPDATA% location instead.
cfg_in_gamedir    = true
player_id         = 1000000000000000
# id_token =                        ; optional; a local token is synthesized if blank

# Real credentials for games that authenticate against LIVE DeNA servers (e.g.
# FFRK via Sakasho). Leave blank for preservation games whose servers you
# redirect to your own endpoint (FFBE) - a placeholder is fine there. For a live
# game, capture these from your own account with tools/andapp_mitm.py and paste
# them here; note the JWT tokens expire (~1 hour) so they must be refreshed.
# access_token      =
# passphrase        =               ; get_in_app_user_id extras.passphrase
# app_id            =               ; get_in_app_user_id id (links.app.id)
# andapp_user_id    =
# device_account_id =
# andapp_client_version = 4.0.4

[ssl]
# Accept any TLS certificate (self-signed / hostname mismatch) so the client can
# reach a preservation server. Affects only this local client process.
bypass = true

[mutex]
# Neutralize the single-instance mutex so the game launches without AndApp.
fix = true

[launch]
# AndApp normally launches the game with --andapp-payload-id=<n>. Launched
# directly that arg is missing and the SDK's initialize fails (error -21015),
# so we inject one. Any positive integer works for our own helper.
inject_payload_id = true
andapp_payload_id = 1

[cef]
# Embedded Chromium (login / portal / store webviews) uses its own network
# stack + TLS, separate from libcurl/OpenSSL. These inject Chromium switches
# (via GetCommandLineW) so those webviews also accept your preservation server.
enabled                   = true
ignore_certificate_errors = true    ; --ignore-certificate-errors (+ related)
disable_web_security      = false   ; --disable-web-security (only if needed)
host_resolver_rules       = true    ; build --host-resolver-rules from [dns]
# extra_switches =                  ; any extra Chromium flags, appended verbatim

[patch]
# Runtime "force-return" patches for statically-linked checks, applied in memory
# so you never hand-edit the game exe. Format:  <anchor string> = <return value>
# The loader finds the function in the main module that references <anchor>, walks
# back to its entry, and makes it `return <value>`.
# Example - defeat FFRK's curl public-key pinning (Curl_pin_peer_pubkey references
# "sha256//"; returning 0 = CURLE_OK = pin always passes):
# sha256// = 0
# (FFBE does not pin this way and needs no entries here.)

[dns]
# Redirect game-server hostnames to your preservation server.
# Format:  <hostname> = <ipv4>
# Used BOTH by the winsock getaddrinfo hook (game/curl traffic) AND, when
# [cef] host_resolver_rules = true, turned into Chromium --host-resolver-rules
# "MAP <host> <ip>" entries for the webview traffic.
#
# The FFBE JP (AndApp) client's real endpoints. Uncomment and set the IP of your
# preservation server (127.0.0.1 if it runs on this machine):
#   v53-ios.game.exvius.com      -> game API / session   (path base /lapis/app)
#   v53-ios.purchase.exvius.com  -> purchase / receipts   (path base /lapis/app)
#   purchase.exvius.com          -> purchase (bare host, just in case)
#   cdn.resource.exvius.com      -> asset CDN             (path base /lapis/resource)
#   v53.notice.exvius.com        -> notices / news (versioned)
#   v24.notice.exvius.com        -> notices / news (older version, still referenced)
#   notice.exvius.com            -> notices / news (unversioned)
# (No separate auth/SSO host: the account token comes via the AndApp helper IPC
#  get_id_token, which the loader already replaces.)
#
v53-ios.game.exvius.com     = 127.0.0.1
v53-ios.purchase.exvius.com = 127.0.0.1
purchase.exvius.com         = 127.0.0.1
cdn.resource.exvius.com     = 127.0.0.1
v53.notice.exvius.com       = 127.0.0.1
v24.notice.exvius.com       = 127.0.0.1
notice.exvius.com           = 127.0.0.1
